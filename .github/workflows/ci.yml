  #      with:
  #        browser: electron
  #        headless: true

  deploy:
    runs-on: self-hosted
    if: github.ref_name == 'DevelopmentBranch'
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker compose -p chessplatform build frontend

      - name: Restart frontend container only
        run: |
          docker compose -p chessplatform up -d frontend

      - name: Verify
        run: docker ps
