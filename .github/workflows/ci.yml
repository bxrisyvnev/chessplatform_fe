  #    - name: Cypress e2e
  #      uses: cypress-io/github-action@v6
  #      with:
  #        browser: electron
  #        headless: true

  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    if: github.ref_name == 'DevelopmentBranch'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE="" \
            -t ghcr.io/${{ github.repository_owner }}/chessplatform-fe:latest \
            -t ghcr.io/${{ github.repository_owner }}/chessplatform-fe:${{ github.sha }} \
            .

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/chessplatform-fe:latest
          docker push ghcr.io/${{ github.repository_owner }}/chessplatform-fe:${{ github.sha }}

      - name: Deploy frontend on home server
        run: |
          cd /home/boris/chessplatform
          docker compose pull frontend
          docker compose up -d --no-deps frontend
          docker image prune -f
