services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ChessplatformFE
    ports:
      - "5173:5173"
    networks:
      - my-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: chessplatform_db
      MYSQL_USER: springuser
      MYSQL_PASSWORD: ${DATASOURCE_PASS}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - my-network

  backend:
    image: s3-chessplatform-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JWT_SECRET: ${JWT_SECRET}
        DATASOURCE_PASS: ${DATASOURCE_PASS}
    container_name: backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chessplatform_db
      SPRING_DATASOURCE_USERNAME: springuser
      SPRING_DATASOURCE_PASSWORD: ${DATASOURCE_PASS}
      JWT_SECRET: ${JWT_SECRET}
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    networks:
      - my-network

volumes:
  mysql-data:

networks:
  my-network:
    driver: bridge
